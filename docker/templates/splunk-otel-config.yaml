# If the collector is installed without the Linux/Windows installer script, the following
# environment variables are required to be manually defined or configured below:
# - SPLUNK_ACCESS_TOKEN: The Splunk access token to authenticate requests
# - SPLUNK_API_URL: The Splunk API URL, e.g. https://api.us0.signalfx.com
# - SPLUNK_BUNDLE_DIR: The path to the Smart Agent bundle, e.g. /usr/lib/splunk-otel-collector/agent-bundle
# - SPLUNK_COLLECTD_DIR: The path to the collectd config directory for the Smart Agent, e.g. /usr/lib/splunk-otel-collector/agent-bundle/run/collectd
# - SPLUNK_HEC_TOKEN: The Splunk HEC authentication token
# - SPLUNK_HEC_URL: The Splunk HEC endpoint URL, e.g. https://ingest.us0.signalfx.com/v1/log
# - SPLUNK_INGEST_URL: The Splunk ingest URL, e.g. https://ingest.us0.signalfx.com
# - SPLUNK_LISTEN_INTERFACE: The network interface the agent receivers listen on.

extensions:
  headers_setter:
    headers:
      - action: upsert
        key: X-SF-TOKEN
        from_context: X-SF-TOKEN
        default_value: "${SPLUNK_ACCESS_TOKEN}"

receivers: 
#======================================
# GOGS TRACES 
#======================================
  otlp/traces:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

#======================================
# GOGS LOGS 
#======================================
  filelog/logs:
    include: [ /app/gogs/log/*.log ]
    operators:
      - type: regex_parser
        regex: '^(?P<time>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}) (?P<sev>[A-Z]*) (?P<msg>.*)$'
        timestamp:
          parse_from: attributes.time
          layout: '%Y-%m-%d %H:%M:%S'
        severity:
          parse_from: attributes.sev

#======================================
# GOGS METRICS 
#======================================
  hostmetrics/metrics:
    collection_interval: 30s
    scrapers:
      cpu:
      disk:
      load:
      paging:
      network:
      processes:
      filesystem:
        metrics:
          system.filesystem.utilization:
            enabled: true 
      memory:
        metrics:
          system.memory.utilization:
            enabled: true    

  # prometheus/internal:
  #   config:
  #     scrape_configs:
  #     - job_name: 'prometheus-gogs'
  #       scrape_interval: 10s
  #       static_configs:
  #       - targets: ["0.0.0.0:3000"]

processors:
  batch:
    metadata_keys:
      - X-SF-Token
  memory_limiter:
    check_interval: 5s
    limit_mib: ${SPLUNK_MEMORY_LIMIT_MIB}
  resourcedetection:
    detectors: [gcp, ecs, ec2, azure, system]
    override: true  

exporters:
  # Traces to Splunk Cloud
  splunk_hec/traces:
    token: "${SPLUNK_HEC_TRACES_TOKEN}"
    endpoint: "${SPLUNK_HEC_URL}"
    source: "otel_traces"
    index: "traces"
    tls:
      insecure_skip_verify: true

  # Metrics to Splunk Cloud
  splunk_hec/metrics:
    token: "${SPLUNK_HEC_METRICS_TOKEN}"
    endpoint: "${SPLUNK_HEC_URL}"
    source: "otel_metrics"
    index: "metrics"
    tls:
      insecure_skip_verify: true

  # Logs
  splunk_hec/logs:
    token: "${SPLUNK_HEC_LOGS_TOKEN}"
    endpoint: "${SPLUNK_HEC_URL}"
    source: "otel_logs"
    index: "logs"
    tls:
      insecure_skip_verify: true

  # Metrics + Events
  signalfx:
    access_token: "${SPLUNK_ACCESS_TOKEN}"
    api_url: "${SPLUNK_API_URL}"
    ingest_url: "${SPLUNK_INGEST_URL}"
    sync_host_metadata: true
    correlation:

  # Traces
  otlphttp:
    traces_endpoint: "${SPLUNK_INGEST_URL}/v2/trace/otlp"
    headers:
      "X-SF-Token": "${SPLUNK_ACCESS_TOKEN}"
    auth:
      authenticator: headers_setter

  # Traces (Alternative)
  sapm:
    access_token: "${SPLUNK_ACCESS_TOKEN}"
    endpoint: "${SPLUNK_INGEST_URL}/v2/trace"

service:
  extensions: [headers_setter]
  pipelines:
    traces:
      receivers: [otlp/traces]
      processors: [batch, resourcedetection]
      exporters: [splunk_hec/traces, otlphttp] #  sapm

    metrics:
      receivers: [hostmetrics/metrics] # prometheus/internal
      processors: [batch, resourcedetection]
      exporters: [splunk_hec/metrics, signalfx]

    logs:
      receivers: [filelog/logs]
      processors: [batch, resourcedetection]
      exporters: [splunk_hec/logs]